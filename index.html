<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TicTacToe - UI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Tic Tac Toe</h1>
    <div id="status" class="status" aria-live="polite">Turn: X</div>

    <div id="board" class="board" role="grid" aria-label="Bàn Tic Tac Toe">
      <button class="cell" data-index="0" aria-label="Ô 1"></button>
      <button class="cell" data-index="1" aria-label="Ô 2"></button>
      <button class="cell" data-index="2" aria-label="Ô 3"></button>
      <button class="cell" data-index="3" aria-label="Ô 4"></button>
      <button class="cell" data-index="4" aria-label="Ô 5"></button>
      <button class="cell" data-index="5" aria-label="Ô 6"></button>
      <button class="cell" data-index="6" aria-label="Ô 7"></button>
      <button class="cell" data-index="7" aria-label="Ô 8"></button>
      <button class="cell" data-index="8" aria-label="Ô 9"></button>
    </div>

    <div class="controls">
      <button id="resetBtn">Reset</button>
      <button id="aiBtn">Play vs AI</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
